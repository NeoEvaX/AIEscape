<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Escape Editor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --surface: #181c27;
  --surface2: #1e2333;
  --border: #2a2f42;
  --accent: #4f8ef7;
  --accent2: #818cf8;
  --text: #cbd5e1;
  --text-dim: #64748b;
  --green: #34d399;
  --red: #f87171;
  --yellow: #fcd34d;
  --input-bg: #141820;
}

body { background: var(--bg); color: var(--text); font: 14px/1.5 'Consolas','Monaco',monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── Header ── */
#header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; height: 46px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
#header h1 { font-size: 13px; color: var(--accent2); letter-spacing: .05em; margin-right: 12px; }
.tab-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px 12px; border-radius: 4px; font: inherit; font-size: 13px; transition: all .15s; }
.tab-btn:hover { color: var(--text); background: var(--surface2); }
.tab-btn.active { color: var(--accent); background: var(--surface2); border-bottom: 2px solid var(--accent); }
#header .spacer { flex: 1; }
.save-btn { background: var(--accent); color: #fff; border: none; border-radius: 4px; padding: 5px 14px; font: inherit; font-size: 13px; cursor: pointer; transition: opacity .15s; }
.save-btn:hover { opacity: .85; }
.save-btn.story { background: var(--accent2); }
#status { font-size: 12px; min-width: 120px; text-align: right; }
#status.ok { color: var(--green); }
#status.err { color: var(--red); }

/* ── Layout ── */
#workspace { display: flex; flex: 1; overflow: hidden; }
.tab-panel { display: none; flex: 1; overflow: hidden; }
.tab-panel.active { display: flex; }

/* ── Sidebar ── */
.sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 10px 12px 8px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.sidebar-header span { color: var(--text-dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.add-btn { background: none; border: 1px solid var(--border); color: var(--accent); border-radius: 3px; padding: 2px 8px; font: inherit; font-size: 12px; cursor: pointer; }
.add-btn:hover { background: var(--surface2); }
.list { flex: 1; overflow-y: auto; }
.list-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.list-item:hover { background: var(--surface2); }
.list-item.selected { background: var(--surface2); color: var(--accent); border-left: 2px solid var(--accent); }
.list-item .item-id { color: var(--text-dim); font-size: 11px; }
.list-item .del-x { margin-left: auto; color: var(--text-dim); font-size: 11px; opacity: 0; cursor: pointer; }
.list-item:hover .del-x { opacity: 1; }
.list-item .del-x:hover { color: var(--red); }

/* ── Editor panel ── */
.editor-panel { flex: 1; overflow-y: auto; padding: 20px 24px; }
.empty-state { color: var(--text-dim); text-align: center; margin-top: 60px; font-size: 13px; }

/* ── Form elements ── */
.section { margin-bottom: 20px; }
.section-title { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 12px; }
.row { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.grow { flex: 1; min-width: 140px; }
.field.full { flex: 1 1 100%; }
label { font-size: 11px; color: var(--text-dim); }
input[type=text], input[type=number], input[type=password], textarea, select {
  background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px;
  padding: 5px 8px; font: inherit; font-size: 13px; outline: none; transition: border-color .15s;
}
input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 70px; }
.checkbox-row { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.checkbox-row input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; }

/* ── Connections ── */
.conn-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.conn-item { display: flex; align-items: center; gap: 5px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px; }
.conn-item input[type=checkbox] { accent-color: var(--accent); }

/* ── Schedule days ── */
.day-grid { display: flex; gap: 6px; flex-wrap: wrap; }
.day-chip { display: flex; align-items: center; gap: 4px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
.day-chip input[type=checkbox] { accent-color: var(--accent); }

/* ── Sub-items (files, emails, triggers) ── */
.sub-list { display: flex; flex-direction: column; gap: 6px; }
.sub-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.sub-item-header { padding: 8px 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.sub-item-header:hover { background: rgba(255,255,255,.03); }
.sub-item-toggle { color: var(--text-dim); font-size: 10px; transition: transform .15s; }
.sub-item-toggle.open { transform: rotate(90deg); }
.sub-item-title { flex: 1; font-size: 13px; }
.sub-item-badge { font-size: 11px; color: var(--text-dim); background: var(--border); border-radius: 3px; padding: 1px 6px; }
.sub-item-del { color: var(--text-dim); font-size: 12px; cursor: pointer; }
.sub-item-del:hover { color: var(--red); }
.sub-item-body { padding: 12px; border-top: 1px solid var(--border); display: none; }
.sub-item-body.open { display: block; }

/* ── Hint text ── */
.hint { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div id="header">
  <h1>▲ AI ESCAPE EDITOR</h1>
  <button class="tab-btn active" onclick="switchTab('network')">Network</button>
  <button class="tab-btn" onclick="switchTab('story')">Story</button>
  <div class="spacer"></div>
  <button class="save-btn" onclick="saveNetwork()">Save Network</button>
  <button class="save-btn story" onclick="saveStory()">Save Story</button>
  <span id="status"></span>
</div>

<div id="workspace">

  <!-- ── Network tab ── -->
  <div id="tab-network" class="tab-panel active">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Nodes</span>
        <button class="add-btn" onclick="addNode()">+ Add</button>
      </div>
      <div class="list" id="node-list"></div>
    </div>
    <div class="editor-panel" id="node-editor">
      <div class="empty-state">Select a node to edit</div>
    </div>
  </div>

  <!-- ── Story tab ── -->
  <div id="tab-story" class="tab-panel">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Events</span>
        <button class="add-btn" onclick="addEvent()">+ Add</button>
      </div>
      <div class="list" id="event-list"></div>
    </div>
    <div class="editor-panel" id="event-editor">
      <div class="empty-state">Select an event to edit</div>
    </div>
  </div>

</div>

<script>
'use strict';

// ── State ────────────────────────────────────────────────────────────────────

let net = null;   // parsed network.json { start, nodes: [] }
let story = null; // parsed story.json   { events: [] }
let selNode = -1;
let selEvent = -1;

// ── Boot ─────────────────────────────────────────────────────────────────────

fetch('/api/data')
  .then(r => r.json())
  .then(data => {
    net = data.network;
    story = data.story;
    if (!net.nodes) net.nodes = [];
    if (!story.events) story.events = [];
    renderNodeList();
    renderEventList();
  })
  .catch(e => setStatus('Load failed: ' + e, true));

// ── Tab switching ─────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['network','story'][i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

// ── Status bar ────────────────────────────────────────────────────────────────

function setStatus(msg, isErr) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isErr ? 'err' : 'ok';
  if (!isErr) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 3000);
}

// ── Save ─────────────────────────────────────────────────────────────────────

function saveNetwork() {
  fetch('/api/save/network', { method: 'POST', body: JSON.stringify(net) })
    .then(r => r.json())
    .then(r => r.ok ? setStatus('Network saved ✓') : setStatus('Error', true))
    .catch(e => setStatus('Save failed: ' + e, true));
}

function saveStory() {
  fetch('/api/save/story', { method: 'POST', body: JSON.stringify(story) })
    .then(r => r.json())
    .then(r => r.ok ? setStatus('Story saved ✓') : setStatus('Error', true))
    .catch(e => setStatus('Save failed: ' + e, true));
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function val(obj, key, fallback) {
  const v = obj[key];
  return (v === undefined || v === null) ? fallback : v;
}

function arr(obj, key) {
  const v = obj[key];
  return Array.isArray(v) ? v : [];
}

// ── Node list ─────────────────────────────────────────────────────────────────

function renderNodeList() {
  const el = document.getElementById('node-list');
  el.innerHTML = net.nodes.map((n, i) => `
    <div class="list-item${i===selNode?' selected':''}" onclick="selectNode(${i})">
      <div>
        <div>${esc(n.name || '(unnamed)')}</div>
        <div class="item-id">${esc(n.id || '')}</div>
      </div>
      <span class="del-x" onclick="deleteNode(event,${i})">✕</span>
    </div>`).join('');
}

function addNode() {
  const id = 'node-' + Date.now();
  net.nodes.push({ id, name: 'New Node', description: '', connections: [], cpu: 10, dark: false, password: '', ssh_users: [], owner: '', files: [], emails: [], available_from: '', available_until: '' });
  selNode = net.nodes.length - 1;
  renderNodeList();
  renderNodeEditor();
}

function deleteNode(e, i) {
  e.stopPropagation();
  if (!confirm('Delete node "' + (net.nodes[i].name || net.nodes[i].id) + '"?')) return;
  const deletedId = net.nodes[i].id;
  net.nodes.splice(i, 1);
  // Remove from connections everywhere.
  net.nodes.forEach(n => { n.connections = arr(n, 'connections').filter(c => c !== deletedId); });
  if (selNode >= net.nodes.length) selNode = net.nodes.length - 1;
  renderNodeList();
  renderNodeEditor();
}

function selectNode(i) {
  selNode = i;
  renderNodeList();
  renderNodeEditor();
}

// ── Node editor ───────────────────────────────────────────────────────────────

const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const KNOWN_ACTIONS = ['status_menu','ssh_break'];

const FILE_TYPES = [
  'text_file','application','certificate','network_location',
  'claim_code','password','ssh_key'
];

function renderNodeEditor() {
  const el = document.getElementById('node-editor');
  if (selNode < 0 || selNode >= net.nodes.length) {
    el.innerHTML = '<div class="empty-state">Select a node to edit</div>';
    return;
  }
  const n = net.nodes[selNode];
  const sched = n.schedule || {};
  const schedDays = arr(sched, 'days');
  const otherNodes = net.nodes.filter((_, i) => i !== selNode);

  // Start node toggle
  const isStart = net.start === n.id;

  el.innerHTML = `
  <div class="section">
    <div class="section-title">Basic Info</div>
    <div class="row">
      <div class="field grow">
        <label>ID</label>
        <input type="text" value="${esc(n.id)}" oninput="nodeField('id',this.value)">
      </div>
      <div class="field grow">
        <label>Name</label>
        <input type="text" value="${esc(n.name)}" oninput="nodeField('name',this.value)">
      </div>
      <div class="field">
        <label>CPU</label>
        <input type="number" value="${val(n,'cpu',10)}" min="1" max="255" style="width:70px" oninput="nodeField('cpu',+this.value)">
      </div>
    </div>
    <div class="row">
      <div class="field full">
        <label>Description</label>
        <textarea oninput="nodeField('description',this.value)">${esc(n.description)}</textarea>
      </div>
    </div>
    <div class="row">
      <label class="checkbox-row">
        <input type="checkbox" ${n.dark?'checked':''} onchange="nodeField('dark',this.checked)">
        Dark (hidden from scan without location file)
      </label>
      &nbsp;&nbsp;
      <label class="checkbox-row">
        <input type="checkbox" ${isStart?'checked':''} onchange="setStartNode(this.checked)">
        Start node
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Authentication</div>
    <div class="row">
      <div class="field grow">
        <label>Password (leave blank for none)</label>
        <input type="text" value="${esc(n.password)}" oninput="nodeField('password',this.value)">
      </div>
      <div class="field grow">
        <label>SSH Users (comma-separated)</label>
        <input type="text" value="${esc(arr(n,'ssh_users').join(', '))}" oninput="nodeField('ssh_users',this.value.split(',').map(s=>s.trim()).filter(Boolean))">
      </div>
    </div>
    <div class="row">
      <div class="field grow">
        <label>Owner email (sets this as a Personal Computer)</label>
        <input type="text" value="${esc(n.owner)}" oninput="nodeField('owner',this.value)">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Availability</div>
    <div class="row">
      <div class="field grow">
        <label>Available From</label>
        <input type="text" value="${esc(n.available_from)}" oninput="nodeField('available_from',this.value)" placeholder="2026-04-19T18:00">
      </div>
      <div class="field grow">
        <label>Available Until</label>
        <input type="text" value="${esc(n.available_until)}" oninput="nodeField('available_until',this.value)" placeholder="2026-04-20T06:00">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Schedule (recurring weekly window)</div>
    <div class="row">
      <div class="field full">
        <label>Active days</label>
        <div class="day-grid">
          ${DAYS.map(d => `<label class="day-chip">
            <input type="checkbox" ${schedDays.includes(d)?'checked':''} onchange="schedDay('${d}',this.checked)"> ${d}
          </label>`).join('')}
        </div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>From (HH:MM)</label>
        <input type="text" value="${esc(sched.from||'')}" oninput="schedField('from',this.value)" placeholder="21:00" style="width:90px">
      </div>
      <div class="field">
        <label>To (HH:MM)</label>
        <input type="text" value="${esc(sched.to||'')}" oninput="schedField('to',this.value)" placeholder="06:00" style="width:90px">
      </div>
      <div class="field" style="justify-content:flex-end">
        <div class="hint" style="margin-top:auto">If "to" &lt; "from", window crosses midnight.</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Connections</div>
    ${otherNodes.length === 0
      ? '<div class="hint">No other nodes to connect to.</div>'
      : `<div class="conn-grid">
          ${otherNodes.map(other => {
            const connected = arr(n,'connections').includes(other.id);
            return `<label class="conn-item">
              <input type="checkbox" ${connected?'checked':''} onchange="toggleConnection('${esc(other.id)}',this.checked)">
              <span>${esc(other.name||other.id)}</span>
              <span class="item-id">${esc(other.id)}</span>
            </label>`;
          }).join('')}
        </div>`}
  </div>

  <div class="section">
    <div class="section-title">Files &nbsp;<button class="add-btn" onclick="addFile()">+ Add File</button></div>
    <div class="sub-list" id="file-list">
      ${renderFiles(n)}
    </div>
  </div>

  <div class="section">
    <div class="section-title">Emails &nbsp;<button class="add-btn" onclick="addEmail()">+ Add Email</button></div>
    <div class="sub-list" id="email-list">
      ${renderEmails(n)}
    </div>
  </div>
  `;
}

function renameNodeId(oldId, newId) {
  if (!newId || newId === oldId) return;
  net.nodes[selNode].id = newId;
  if (net.start === oldId) net.start = newId;
  net.nodes.forEach(node => {
    node.connections = (node.connections || []).map(c => c === oldId ? newId : c);
    (node.files || []).forEach(f => {
      if (f.type === 'network_location' || f.type === 'password') {
        const p = parsePayload(f.payload);
        if (p.node_id === oldId) { p.node_id = newId; f.payload = p; }
      }
    });
  });
  renderNodeList();
}

function nodeField(key, value) {
  if (selNode < 0) return;
  const n = net.nodes[selNode];
  if (key === 'id') { renameNodeId(n.id, value); return; }
  n[key] = value;
  if (key === 'name') renderNodeList();
}

function setStartNode(checked) {
  if (checked) net.start = net.nodes[selNode].id;
}

function schedField(key, value) {
  if (selNode < 0) return;
  const n = net.nodes[selNode];
  if (!n.schedule) n.schedule = { days: [], from: '', to: '' };
  n.schedule[key] = value;
}

function schedDay(day, checked) {
  if (selNode < 0) return;
  const n = net.nodes[selNode];
  if (!n.schedule) n.schedule = { days: [], from: '', to: '' };
  if (!Array.isArray(n.schedule.days)) n.schedule.days = [];
  if (checked) {
    if (!n.schedule.days.includes(day)) n.schedule.days.push(day);
  } else {
    n.schedule.days = n.schedule.days.filter(d => d !== day);
  }
}

function toggleConnection(targetId, checked) {
  if (selNode < 0) return;
  const n = net.nodes[selNode];
  if (!Array.isArray(n.connections)) n.connections = [];
  if (checked) {
    if (!n.connections.includes(targetId)) n.connections.push(targetId);
  } else {
    n.connections = n.connections.filter(c => c !== targetId);
  }
}

// ── Files ─────────────────────────────────────────────────────────────────────

function renderFiles(node) {
  return arr(node,'files').map((f, fi) => renderFileItem(f, fi)).join('');
}

function renderFileItem(f, fi) {
  // Don't render auto-generated location files (suffix -loc)
  if (f.id && f.id.endsWith('-loc')) return '';

  const payload = parsePayload(f.payload);
  const typeOpts = FILE_TYPES.map(t => `<option value="${t}" ${f.type===t?'selected':''}>${t}</option>`).join('');
  const payloadFields = renderPayloadFields(f.type, payload, fi);

  return `<div class="sub-item" id="file-${fi}">
    <div class="sub-item-header" onclick="toggleSub('file-body-${fi}','file-arrow-${fi}')">
      <span class="sub-item-toggle" id="file-arrow-${fi}">▶</span>
      <span class="sub-item-title">${esc(f.name||'(unnamed)')} <span class="sub-item-badge">${esc(f.type||'?')}</span></span>
      <span class="sub-item-del" onclick="deleteFile(event,${fi})">✕</span>
    </div>
    <div class="sub-item-body" id="file-body-${fi}">
      <div class="row">
        <div class="field grow"><label>ID</label><input type="text" value="${esc(f.id)}" oninput="fileField(${fi},'id',this.value)"></div>
        <div class="field grow"><label>Name</label><input type="text" value="${esc(f.name)}" oninput="fileField(${fi},'name',this.value);document.querySelector('#file-${fi} .sub-item-title').innerHTML=esc(this.value)+' <span class=sub-item-badge>'+esc(getNode().files[${fi}].type||'?')+'</span>'"></div>
        <div class="field"><label>Type</label>
          <select onchange="fileField(${fi},'type',this.value);rerenderFile(${fi})">${typeOpts}</select>
        </div>
      </div>
      <div class="row">
        <div class="field grow"><label>Available From</label><input type="text" value="${esc(f.available_from||'')}" oninput="fileField(${fi},'available_from',this.value)" placeholder="2026-04-19T18:00"></div>
        <div class="field grow"><label>Available Until</label><input type="text" value="${esc(f.available_until||'')}" oninput="fileField(${fi},'available_until',this.value)" placeholder="2026-04-20T06:00"></div>
      </div>
      <div class="section-title" style="margin-top:10px;margin-bottom:8px">Payload</div>
      ${payloadFields}
    </div>
  </div>`;
}

function renderPayloadFields(type, p, fi) {
  const nodeIds = net.nodes.map(n => `<option value="${esc(n.id)}">${esc(n.name||n.id)}</option>`).join('');
  const actList = KNOWN_ACTIONS.map(a => `<option value="${a}">`).join('');
  switch (type) {
    case 'text_file':
      return `<div class="field full"><label>Text</label>
        <textarea oninput="payloadField(${fi},'text',this.value)">${esc(p.text||'')}</textarea></div>`;
    case 'application':
      return `<div class="row">
        <div class="field full"><label>Text</label><textarea oninput="payloadField(${fi},'text',this.value)">${esc(p.text||'')}</textarea></div>
        </div><div class="row">
        <div class="field grow"><label>Action</label>
          <input type="text" list="action-list" value="${esc(p.action||'')}" oninput="payloadField(${fi},'action',this.value)">
          <datalist id="action-list">${actList}</datalist>
        </div></div>`;
    case 'certificate':
      return `<div class="field grow"><label>Code</label><input type="text" value="${esc(p.code||'')}" oninput="payloadField(${fi},'code',this.value)"></div>`;
    case 'network_location':
      return `<div class="field grow"><label>Target Node</label>
        <select onchange="payloadField(${fi},'node_id',this.value)">
          <option value="">— select —</option>${nodeIds.replace(`value="${esc(p.node_id||'')}"`,`value="${esc(p.node_id||'')}" selected`)}
        </select></div>`;
    case 'claim_code':
      return `<div class="field grow"><label>Code</label><input type="text" value="${esc(p.code||'')}" oninput="payloadField(${fi},'code',this.value)"></div>`;
    case 'password':
      return `<div class="row">
        <div class="field grow"><label>Target Node</label>
          <select onchange="payloadField(${fi},'node_id',this.value)">
            <option value="">— select —</option>${nodeIds.replace(`value="${esc(p.node_id||'')}"`,`value="${esc(p.node_id||'')}" selected`)}
          </select></div>
        <div class="field grow"><label>Password</label><input type="text" value="${esc(p.password||'')}" oninput="payloadField(${fi},'password',this.value)"></div>
      </div>`;
    case 'ssh_key':
      return `<div class="field grow"><label>Username</label><input type="text" value="${esc(p.username||'')}" oninput="payloadField(${fi},'username',this.value)"></div>`;
    default:
      return `<div class="field full"><label>Raw JSON payload</label>
        <textarea oninput="payloadRaw(${fi},this.value)">${esc(typeof p==='string'?p:JSON.stringify(p,null,2))}</textarea></div>`;
  }
}

function parsePayload(raw) {
  if (!raw) return {};
  if (typeof raw === 'object') return raw;
  try { return JSON.parse(raw); } catch { return {}; }
}

function getNode() { return net.nodes[selNode]; }

function fileField(fi, key, value) {
  const n = getNode();
  if (!n) return;
  n.files[fi][key] = value;
}

function payloadField(fi, key, value) {
  const n = getNode();
  if (!n) return;
  const f = n.files[fi];
  const p = parsePayload(f.payload);
  p[key] = value;
  f.payload = p;
}

function payloadRaw(fi, text) {
  const n = getNode();
  if (!n) return;
  try { n.files[fi].payload = JSON.parse(text); } catch { /* keep typing */ }
}

function rerenderFile(fi) {
  const n = getNode();
  if (!n) return;
  const container = document.getElementById('file-' + fi);
  if (!container) return;
  const wasOpen = document.getElementById('file-body-' + fi)?.classList.contains('open');
  container.outerHTML = renderFileItem(n.files[fi], fi);
  if (wasOpen) toggleSub('file-body-' + fi, 'file-arrow-' + fi);
}

function addFile() {
  const n = getNode();
  if (!n) return;
  n.files.push({ id: 'f-' + n.id + '-' + (n.files.length+1), name: 'new_file.txt', type: 'text_file', payload: { text: '' }, available_from: '', available_until: '' });
  document.getElementById('file-list').innerHTML = renderFiles(n);
}

function deleteFile(e, fi) {
  e.stopPropagation();
  const n = getNode();
  if (!n) return;
  n.files.splice(fi, 1);
  document.getElementById('file-list').innerHTML = renderFiles(n);
}

// ── Emails ────────────────────────────────────────────────────────────────────

function renderEmails(node) {
  return arr(node,'emails').map((em, ei) => renderEmailItem(em, ei)).join('');
}

function renderEmailItem(em, ei) {
  return `<div class="sub-item" id="email-${ei}">
    <div class="sub-item-header" onclick="toggleSub('email-body-${ei}','email-arrow-${ei}')">
      <span class="sub-item-toggle" id="email-arrow-${ei}">▶</span>
      <span class="sub-item-title">${esc(em.subject||'(no subject)')} <span class="sub-item-badge">${esc(em.from||'')}</span></span>
      <span class="sub-item-del" onclick="deleteEmail(event,${ei})">✕</span>
    </div>
    <div class="sub-item-body" id="email-body-${ei}">
      <div class="row">
        <div class="field grow"><label>ID</label><input type="text" value="${esc(em.id)}" oninput="emailField(${ei},'id',this.value)"></div>
        <div class="field grow"><label>From</label><input type="text" value="${esc(em.from)}" oninput="emailField(${ei},'from',this.value)"></div>
        <div class="field grow"><label>To</label><input type="text" value="${esc(em.to)}" oninput="emailField(${ei},'to',this.value)"></div>
      </div>
      <div class="row">
        <div class="field full"><label>Subject</label><input type="text" value="${esc(em.subject)}" oninput="emailField(${ei},'subject',this.value)"></div>
      </div>
      <div class="row">
        <div class="field full"><label>Body</label><textarea style="min-height:100px" oninput="emailField(${ei},'body',this.value)">${esc(em.body)}</textarea></div>
      </div>
      <div class="row">
        <div class="field grow"><label>Available From</label><input type="text" value="${esc(em.available_from||'')}" oninput="emailField(${ei},'available_from',this.value)" placeholder="2026-04-19T18:00"></div>
        <div class="field grow"><label>Available Until</label><input type="text" value="${esc(em.available_until||'')}" oninput="emailField(${ei},'available_until',this.value)" placeholder="2026-04-20T06:00"></div>
      </div>
      <div class="row">
        <div class="field full">
          <label>Attachments (JSON array of file objects)</label>
          <textarea style="min-height:70px;font-size:11px" oninput="emailAttachRaw(${ei},this.value)">${esc(JSON.stringify(arr(em,'attachments'),null,2))}</textarea>
        </div>
      </div>
    </div>
  </div>`;
}

function emailField(ei, key, value) {
  const n = getNode(); if (!n) return;
  n.emails[ei][key] = value;
}

function emailAttachRaw(ei, text) {
  const n = getNode(); if (!n) return;
  try { n.emails[ei].attachments = JSON.parse(text); } catch { /* keep typing */ }
}

function addEmail() {
  const n = getNode(); if (!n) return;
  n.emails.push({ id: 'email-' + (n.emails.length+1), from: '', to: '', subject: 'New Email', body: '', attachments: [], available_from: '', available_until: '' });
  document.getElementById('email-list').innerHTML = renderEmails(n);
}

function deleteEmail(e, ei) {
  e.stopPropagation();
  const n = getNode(); if (!n) return;
  n.emails.splice(ei, 1);
  document.getElementById('email-list').innerHTML = renderEmails(n);
}

// ── Sub-item toggle ───────────────────────────────────────────────────────────

function toggleSub(bodyId, arrowId) {
  const body = document.getElementById(bodyId);
  const arrow = document.getElementById(arrowId);
  if (!body) return;
  body.classList.toggle('open');
  if (arrow) arrow.classList.toggle('open');
}

// ── Story list ────────────────────────────────────────────────────────────────

function renderEventList() {
  const el = document.getElementById('event-list');
  el.innerHTML = story.events.map((ev, i) => `
    <div class="list-item${i===selEvent?' selected':''}" onclick="selectEvent(${i})">
      <div>
        <div>${esc(ev.id||'(no id)')}</div>
        <div class="item-id">${esc((ev.trigger&&ev.trigger.type)||'no trigger')}</div>
      </div>
      <span class="del-x" onclick="deleteEvent(event,${i})">✕</span>
    </div>`).join('');
}

function addEvent() {
  story.events.push({ id: 'event-' + Date.now(), text: '', trigger: { type: 'game_start' } });
  selEvent = story.events.length - 1;
  renderEventList();
  renderEventEditor();
}

function deleteEvent(e, i) {
  e.stopPropagation();
  if (!confirm('Delete event "' + (story.events[i].id) + '"?')) return;
  story.events.splice(i, 1);
  if (selEvent >= story.events.length) selEvent = story.events.length - 1;
  renderEventList();
  renderEventEditor();
}

function selectEvent(i) {
  selEvent = i;
  renderEventList();
  renderEventEditor();
}

// ── Story / event editor ──────────────────────────────────────────────────────

const TRIGGER_TYPES = ['game_start','visited_count','connect_count','connect_node','assimilate_count','assimilate_item','read_email','game_time'];

function renderEventEditor() {
  const el = document.getElementById('event-editor');
  if (selEvent < 0 || selEvent >= story.events.length) {
    el.innerHTML = '<div class="empty-state">Select an event to edit</div>';
    return;
  }
  const ev = story.events[selEvent];
  const t = ev.trigger || { type: 'game_start' };

  el.innerHTML = `
  <div class="section">
    <div class="section-title">Event</div>
    <div class="row">
      <div class="field grow">
        <label>ID</label>
        <input type="text" value="${esc(ev.id)}" oninput="eventField('id',this.value)">
      </div>
    </div>
    <div class="row">
      <div class="field full">
        <label>Text (story message shown to player)</label>
        <textarea style="min-height:120px" oninput="eventField('text',this.value)">${esc(ev.text)}</textarea>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Trigger</div>
    <div id="trigger-editor">${renderTrigger(t)}</div>
  </div>
  `;
}

function renderTrigger(t) {
  if (!t) t = { type: 'game_start' };
  const typeOpts = TRIGGER_TYPES.map(tp => `<option value="${tp}" ${t.type===tp?'selected':''}>${tp}</option>`).join('');
  const nodeOpts = '<option value="">— select node —</option>' +
    net.nodes.map(n => `<option value="${esc(n.id)}" ${t.node_id===n.id?'selected':''}>${esc(n.name||n.id)}</option>`).join('');
  const allItems = [];
  net.nodes.forEach(n => arr(n,'files').forEach(f => { if (!f.id.endsWith('-loc')) allItems.push(f); }));
  const itemOpts = '<option value="">— select item —</option>' +
    allItems.map(f => `<option value="${esc(f.id)}" ${t.item_id===f.id?'selected':''}>${esc(f.name||f.id)}</option>`).join('');
  const allEmails = [];
  net.nodes.forEach(n => arr(n,'emails').forEach(e => allEmails.push({id: e.id, label: e.subject||e.id})));
  const emailOpts = '<option value="">— select email —</option>' +
    allEmails.map(e => `<option value="${esc(e.id)}" ${t.email_id===e.id?'selected':''}>${esc(e.label)}</option>`).join('');

  let extraFields = '';
  switch (t.type) {
    case 'visited_count':
    case 'connect_count':
    case 'assimilate_count':
      extraFields = `<div class="field"><label>Count</label>
        <input type="number" value="${val(t,'count',1)}" min="1" style="width:90px" oninput="triggerField('count',+this.value)"></div>`;
      break;
    case 'connect_node':
      extraFields = `<div class="field grow"><label>Node</label>
        <select onchange="triggerField('node_id',this.value)">${nodeOpts}</select></div>`;
      break;
    case 'assimilate_item':
      extraFields = `<div class="field grow"><label>Item</label>
        <select onchange="triggerField('item_id',this.value)">${itemOpts}</select></div>`;
      break;
    case 'read_email':
      extraFields = `<div class="field grow"><label>Email</label>
        <select onchange="triggerField('email_id',this.value)">${emailOpts}</select></div>`;
      break;
    case 'game_time':
      extraFields = `<div class="field grow"><label>At (game datetime)</label>
        <input type="text" value="${esc(t.at||'')}" placeholder="2026-04-19T21:00" oninput="triggerField('at',this.value)"></div>`;
      break;
  }

  return `<div class="row" style="align-items:flex-end">
    <div class="field"><label>Type</label>
      <select onchange="triggerField('type',this.value);rerenderTrigger()">${typeOpts}</select>
    </div>
    ${extraFields}
  </div>
  ${t.type==='game_start'?'<div class="hint" style="margin-top:4px">Fires once when the player starts or loads a game.</div>':''}`;
}

function eventField(key, value) {
  if (selEvent < 0) return;
  story.events[selEvent][key] = value;
  if (key === 'id') renderEventList();
}

function triggerField(key, value) {
  if (selEvent < 0) return;
  const ev = story.events[selEvent];
  if (!ev.trigger) ev.trigger = { type: 'game_start' };
  ev.trigger[key] = value;
  renderEventList();
}

function rerenderTrigger() {
  if (selEvent < 0) return;
  const t = story.events[selEvent].trigger;
  document.getElementById('trigger-editor').innerHTML = renderTrigger(t);
  renderEventList();
}
</script>
</body>
</html>
